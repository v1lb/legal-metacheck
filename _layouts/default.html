<!doctype html>
<html lang="{{ page.lang | default: 'ru' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ page.title }} · MetaCheck</title>
<meta name="description" content="MetaCheck: support, privacy policy and terms of use.">
<style>
:root{--bg:#f4f8fb;--card:#ffffff;--text:#14202c;--muted:#475a6c;--accent:#006874;--line:#d3dee8;--soft:#e6f0f6}
@media (prefers-color-scheme: dark){
:root{--bg:#07101a;--card:#0e1824;--text:#e6edf5;--muted:#a9b9c9;--accent:#00f3ff;--line:#1f3042;--soft:#13202e}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
header{border-bottom:1px solid var(--line);background:var(--card)}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 18px;padding-top:14px;padding-bottom:14px}
.brand{font-weight:700;letter-spacing:.04em;color:var(--text);text-decoration:none}
.brand::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:9px}
nav{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.92rem}
nav a{color:var(--muted);text-decoration:none}
nav a:hover{color:var(--accent)}
main{padding-top:26px;padding-bottom:40px}
main>.wrap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 20px 22px}
h1{font-size:1.65rem;line-height:1.25;margin:22px 0 10px}
h2{font-size:1.2rem;margin:28px 0 8px;padding-top:6px;border-top:1px solid var(--line)}
h3{font-size:1.02rem;margin:20px 0 4px}
p,li{overflow-wrap:anywhere}
a{color:var(--accent)}
ul,ol{padding-left:22px}
hr{border:0;border-top:1px solid var(--line);margin:30px 0}
code{background:var(--soft);padding:1px 6px;border-radius:6px;font-size:.92em}
footer{color:var(--muted);font-size:.85rem;padding:0 0 28px}
</style>
</head>
<body>
<header>
<div class="wrap">
<a class="brand" href="{{ site.baseurl }}/">MetaCheck</a>
<nav>
<a href="{{ site.baseurl }}/PRIVACY_POLICY_EN.html">Privacy</a>
<a href="{{ site.baseurl }}/PRIVACY_POLICY_RU.html">Конфиденциальность</a>
<a href="{{ site.baseurl }}/TERMS_EN.html">Terms</a>
<a href="{{ site.baseurl }}/TERMS_RU.html">Условия</a>
</nav>
</div>
</header>
<main>
<div class="wrap">
{{ content }}
</div>
</main>
<footer>
<div class="wrap">© 2026 Puwer Studio</div>
</footer>
</body>
</html>
