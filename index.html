<!DOCTYPE html>
<html lang="en">
<head>

    <title>MetaCheck — Legal Documents</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

            margin: 0;

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #adb5bd;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .links-group {
            display: flex;
            gap: 12px;
        }
        a {

            padding: 12px;

            color: #495057;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
